name: Tracker feedback checks

on:
  push:
    branches: [main, feedback/core-batch-delete, feedback/recovery-language-neon]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tracker-feedback-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  host:
    name: JVM, Robolectric and unsigned APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          overwrite-settings: false
      - name: Ensure the repository Android toolchain
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-36/android.jar" ] ||
             [ ! -x "$ANDROID_HOME/build-tools/35.0.0/aapt2" ] ||
             [ ! -x "$ANDROID_HOME/ndk/30.0.16248370/ndk-build" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
              'platforms;android-36' 'build-tools;35.0.0' 'ndk;30.0.16248370'
          fi
      - name: Check whitespace
        run: git diff --check HEAD^ HEAD
      - name: Verify pinned editorial resources
        run: |
          python3 scripts/generate_editorial_resources.py
          python3 scripts/generate_feedback_strings.py
          git diff --exit-code
      - name: Build the isolated host JNI fixture
        run: bash scripts/build-cleanup-host.sh "$JAVA_HOME" "$PWD/build/libtracker_cleanup.so"
      - name: Run complete core and Android host regression suites and lint
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain --continue -PtrackerUnsigned=true \
            -PtrackerCleanupLibrary="$PWD/build/libtracker_cleanup.so" \
            :core:test :app:testDebugUnitTest :app:lintDebug :app:lintRelease 2>&1 | tee build/full-regression.log
      - name: Build an unsigned APK
        run: ./gradlew --no-daemon --console=plain -PtrackerUnsigned=true :app:assembleDebug
      - name: Retain raw test and lint evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tracker-host-regression-${{ github.sha }}
          path: |
            build/full-regression.log
            core/build/test-results/test/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-*
          if-no-files-found: warn
